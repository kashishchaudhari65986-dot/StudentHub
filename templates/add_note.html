{% extends "base.html" %}

{% block title %}Add note | StudentHub{% endblock %}
{% block description %}Add a study note to your StudentHub workspace.{% endblock %}

{% block content %}
<section class="page-hero form-page">
    <div class="container form-card">
        <p class="section-kicker">Capture an idea</p>
        <h1>Add a <span>note.</span></h1>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <form class="auth-form" action="{{ url_for('add_note') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" value="{{ form.get('title', '') }}" required>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" value="{{ form.get('subject', '') }}" required>
            <label for="content">Content</label>
            <textarea id="content" name="content" required>{{ form.get('content', '') }}</textarea>
            <button class="button button-primary" type="submit">Add note</button>
        </form>
    </div>
</section>
{% endblock %}
