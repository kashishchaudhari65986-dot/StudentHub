{% extends "base.html" %}

{% block title %}Edit task | StudentHub{% endblock %}
{% block description %}Update a task in your StudentHub workspace.{% endblock %}

{% block content %}
<section class="page-hero form-page">
    <div class="container form-card">
        <p class="section-kicker">Keep progressing</p>
        <h1>Edit your <span>task.</span></h1>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <form class="auth-form" action="{{ url_for('edit_task', id=task.id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" value="{{ form.get('title', task.title) }}" required>
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ form.get('description', task.description) }}</textarea>
            <label for="due-date">Due date</label>
            <input id="due-date" name="due_date" type="date" value="{{ form.get('due_date', task.due_date.isoformat()) }}" required>
            <button class="button button-primary" type="submit">Save changes</button>
        </form>
    </div>
</section>
{% endblock %}
