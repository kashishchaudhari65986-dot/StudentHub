{% extends "base.html" %}

{% block title %}Edit assignment | StudentHub{% endblock %}
{% block description %}Update an assignment in your StudentHub workspace.{% endblock %}

{% block content %}
<section class="page-hero form-page">
    <div class="container form-card">
        <p class="section-kicker">Keep it current</p>
        <h1>Edit your <span>assignment.</span></h1>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <form class="auth-form" action="{{ url_for('edit_assignment', id=assignment.id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" value="{{ form.get('title', assignment.title) }}" required>
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ form.get('description', assignment.description) }}</textarea>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" value="{{ form.get('subject', assignment.subject) }}" required>
            <label for="due-date">Due date</label>
            <input id="due-date" name="due_date" type="date" value="{{ form.get('due_date', assignment.due_date.isoformat()) }}" required>
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="Pending" {% if form.get('status', assignment.status) == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Completed" {% if form.get('status', assignment.status) == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
            <button class="button button-primary" type="submit">Save changes</button>
        </form>
    </div>
</section>
{% endblock %}
