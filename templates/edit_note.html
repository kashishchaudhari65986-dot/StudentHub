{% extends "base.html" %}

{% block title %}Edit note | StudentHub{% endblock %}
{% block description %}Update a study note in your StudentHub workspace.{% endblock %}

{% block content %}
<section class="page-hero form-page">
    <div class="container form-card">
        <p class="section-kicker">Keep learning</p>
        <h1>Edit your <span>note.</span></h1>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <form class="auth-form" action="{{ url_for('edit_note', id=note.id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" value="{{ form.get('title', note.title) }}" required>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" value="{{ form.get('subject', note.subject) }}" required>
            <label for="content">Content</label>
            <textarea id="content" name="content" required>{{ form.get('content', note.content) }}</textarea>
            <button class="button button-primary" type="submit">Save changes</button>
        </form>
    </div>
</section>
{% endblock %}
